name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PC_OWNER_PASSWORD: pc_owner_ci
  PC_APP_PASSWORD: pc_app_ci
  PC_PLATFORM_PASSWORD: pc_platform_ci
  PC_TILES_PASSWORD: pc_tiles_ci

jobs:
  api:
    name: API lint + tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      db:
        image: imresamu/postgis:16-3.5
        env:
          POSTGRES_DB: precisecapture
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d precisecapture"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only
      DATABASE_URL: postgis://pc_app:pc_app_ci@localhost:5432/precisecapture
      MIGRATION_DATABASE_URL: postgis://pc_owner:pc_owner_ci@localhost:5432/precisecapture
      PLATFORM_DATABASE_URL: postgis://pc_platform:pc_platform_ci@localhost:5432/precisecapture
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      # S3-compatible store for the attachment tests (versitygw; MinIO images are no longer public)
      S3_ENDPOINT_URL: http://localhost:7070
      S3_REGION: us-east-1
      S3_BUCKET: precisecapture-test
      S3_ACCESS_KEY_ID: ci-access
      S3_SECRET_ACCESS_KEY: ci-secret-key
    steps:
      - uses: actions/checkout@v4

      - name: Install GDAL, GEOS and PROJ
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        # The runner's Azure mirror has stalled for hours twice; use the main archive and retry.
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update -q; then break; fi
            echo "apt-get update failed (attempt $attempt)"; sleep 10
          done
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y -q --no-install-recommends \
                gdal-bin libgdal-dev libgeos-dev libproj-dev postgresql-client; then exit 0; fi
            echo "apt-get install failed (attempt $attempt)"; sleep 10
          done
          exit 1

      - name: Create database roles (same script as docker-compose)
        # Service containers cannot mount init scripts, so run the script against the service.
        env:
          PGPASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: precisecapture
          PGHOST: localhost
        run: bash infra/docker/postgres-init/01-roles.sh

      - name: Start an S3-compatible store (versitygw)
        run: |
          mkdir -p "$RUNNER_TEMP/gw"
          docker run -d --name s3 -p 7070:7070 -v "$RUNNER_TEMP/gw:/data" \
            -e ROOT_ACCESS_KEY=ci-access -e ROOT_SECRET_KEY=ci-secret-key \
            versity/versitygw:v1.9.0 posix /data
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:7070/ || true)
            if [ "$code" != "000" ]; then echo "versitygw answering ($code)"; break; fi
            sleep 1
          done
          docker logs s3 | tail -5
          [ "$(docker inspect -f '{{.State.Running}}' s3)" = "true" ] || { echo "versitygw not running"; exit 1; }

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Install API dependencies
        run: make api-install

      - name: Lint
        run: make api-lint

      - name: Migrations are up to date
        working-directory: apps/api
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Tests (incl. integration against Redis)
        working-directory: apps/api
        run: uv run pytest -ra

  web:
    name: Web + schema lint, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and test every workspace package that defines the scripts
        run: pnpm -r --if-present lint && pnpm -r --if-present test
      - name: Build packages
        run: pnpm -r --if-present build
      - name: Mock server smoke test (Prism against contract/openapi.json)
        timeout-minutes: 5
        run: make mock-test
